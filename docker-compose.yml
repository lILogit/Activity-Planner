# KAIROS on Hostinger VPS — single app container behind your own TLS proxy.
#
#   1. cp .env.example .env   → fill keys + PUBLIC_BASE_URL (your proxy's https URL)
#   2. docker compose up -d --build
#
# The app listens on :8000 and is bound to the HOST LOOPBACK (127.0.0.1:8000),
# so it is NOT reachable raw from the internet. Put a TLS reverse proxy on the
# host (nginx or Hostinger's panel proxy) in front of it:
#     https://<DOMAIN>   →   http://127.0.0.1:8000
# Set PUBLIC_BASE_URL to that https URL so the Telegram webhook registers on boot.
#
# The SQLite DB lives in the `data` volume so it survives image recreations.
# Back it up with:
#   docker run --rm -v activity-planner_data:/d alpine cat /d/kairos.db > kairos.db.bak
services:
  app:
    build: .
    image: kairos:latest
    container_name: kairos
    env_file: .env
    environment:
      # Absolute path → lands on the mounted volume. Overrides any DB_PATH in .env.
      DB_PATH: /data/kairos.db
      TZ: ${TZ:-Europe/Prague}
    volumes:
      - data:/data
    ports:
      - "127.0.0.1:8000:8000"   # loopback only — front with your own TLS proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  data:
