# KAIROS on Hostinger VPS — Traefik terminates TLS (Let's Encrypt) and routes
services:
  traefik:
    image: "traefik:v2.10"
    container_name: kairos-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=kairos"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.kairosresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.kairosresolver.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.kairosresolver.acme.storage=/letsencrypt/acme.json"
      - "--accesslog=true"
      - "--accesslog.file.path=/logs/access.log"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_logs:/logs
    networks:
      - kairos

  app:
    # Image is built by GitHub Actions and pushed to GHCR (see .github/workflows/).
    # Hostinger PULLS this image — it does not build from source (its automated
    # deploy environment lacks the full repo build context).
    # For local dev: `docker compose up -d --build` builds from the `build:` below.
    build:
      context: .
    image: ghcr.io/lilogit/activity-planner:latest
    # Without this, `docker compose up -d` skips pulling once the tag exists
    # locally, so a redeploy after a new GHCR push silently reuses the old
    # image. `always` forces a fresh pull every time.
    # One-time setup: the GHCR package is created private on first push (the
    # workflow's GITHUB_TOKEN can't flip that) — make it public once at
    # github.com/lilogit/activity-planner/pkgs/container/activity-planner
    # (Package settings → Change visibility), or `docker login ghcr.io` on
    # the VPS with a PAT that has `read:packages`.
    pull_policy: always
    container_name: kairos
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      # Absolute path → lands on the mounted volume. Overrides any DB_PATH in .env.
      DB_PATH: /data/kairos.db
      TZ: ${TZ:-Europe/Prague}
    volumes:
      - data:/data
    ports:
      - "127.0.0.1:8000:8000"   # loopback only — for local debugging; Traefik reaches the app via the docker network, not this port
    labels:
      - traefik.enable=true
      - traefik.http.routers.kairos.rule=Host(`${DOMAIN_NAME}`)
      - traefik.http.routers.kairos.tls=true
      - traefik.http.routers.kairos.entrypoints=websecure
      - traefik.http.routers.kairos.tls.certresolver=kairosresolver
      - traefik.http.services.kairos.loadbalancer.server.port=8000
      - traefik.http.middlewares.kairos-headers.headers.SSLRedirect=true
      - traefik.http.middlewares.kairos-headers.headers.STSSeconds=315360000
      - traefik.http.middlewares.kairos-headers.headers.browserXSSFilter=true
      - traefik.http.middlewares.kairos-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.kairos-headers.headers.forceSTSHeader=true
      - traefik.http.middlewares.kairos-headers.headers.SSLHost=${DOMAIN_NAME}
      - traefik.http.middlewares.kairos-headers.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.kairos-headers.headers.STSPreload=true
      - traefik.http.routers.kairos.middlewares=kairos-headers@docker
    healthcheck:
      # curl is NOT in the image (only tzdata) — use Python's urllib instead.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - kairos

volumes:
  data:
  traefik_data:
  traefik_logs:

networks:
  kairos:
    driver: bridge

